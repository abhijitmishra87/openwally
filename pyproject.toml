[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openwally"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "crewai-tools>=0.20.0",
    "inspect-ai>=0.3.45",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
openwally     = "openwally.main:run"
openwally-eval = "eval.pipeline_eval:run_eval"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.bandit]
exclude_dirs = ["tests", "eval", ".venv"]
skips = ["B101"]  # assert statements are fine in non-prod code
