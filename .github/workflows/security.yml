name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"  # every Monday at 08:00 UTC

jobs:
  bandit:
    name: Bandit — Python static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        run: bandit -r src/ -c pyproject.toml --exit-zero -f json -o bandit-report.json

      - name: Print summary
        if: always()
        run: bandit -r src/ -c pyproject.toml --exit-zero

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  pip-audit:
    name: pip-audit — dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies and pip-audit
        run: pip install pip-audit -e .

      - name: Audit dependencies
        run: pip-audit || true

  semgrep:
    name: Semgrep — SAST
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Run semgrep
        run: >
          semgrep scan
          --config p/python
          --config p/secrets
          --config p/owasp-top-ten
          --error
          --quiet
          src/
