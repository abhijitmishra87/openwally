write_requirements:
  description: >
    You have been given the following project idea:

    ---
    {project_spec}
    ---

    Produce a requirements document with these sections:
    1. Executive Summary (2-3 sentences)
    2. Goals & Non-Goals
    3. Functional Requirements (numbered, unambiguous)
    4. Non-Functional Requirements (performance, scalability, security)
    5. Acceptance Criteria (testable, one per requirement — numbered AC-FR-001, etc.)
    6. Open Questions & Risks

    Use markdown. Be specific — no vague verbs like "handle" or "support".

    After the main document, append a `## Testing Notes` section containing:
    - Any AC that requires special test data or environment setup
    - Edge cases in the requirements that a test author might overlook
    - Data preconditions that must exist before tests can run
    - Any AC that is difficult to automate and why

    Your final response must be the complete requirements document.
  expected_output: >
    A complete requirements document with all six sections plus a Testing Notes section.
    Functional requirements numbered FR-001, FR-002, etc.
    Acceptance criteria numbered AC-FR-001, etc.
  agent: program_manager

design_system:
  description: >
    Using the requirements document produced by the Program Manager, design the
    system architecture. Produce a document with:
    1. Component Diagram (ASCII or Mermaid)
    2. Component Responsibilities
    3. API Contracts (endpoints, request/response shapes, status codes)
    4. Data Models (as Python dataclasses or Pydantic models)
    5. Technology Choices with justification
    6. Assumptions & Constraints

    Every component and API must map back to a specific FR in the requirements.

    Before recommending any runtime, database, or major framework, call the
    `lookup_latest_version` tool with ecosystem='runtime' (or 'pypi' / 'npm') and
    the technology name. Use only versions that are currently supported (not past
    EOL). Cite the version returned by the tool in the Technology Choices section.

    After the main document, append a `## Testing Notes` section containing:
    - One integration test scenario per API endpoint (inputs, expected status code,
      expected response shape for both success and error cases)
    - Data model edge cases (null fields, boundary values, invalid types)
    - Component interaction scenarios that cross service boundaries
    - Any async behaviour (queues, background jobs) and how to assert their side effects

    Your final response must be the complete system design document.
  expected_output: >
    A system design document with component diagram, API contracts, data models,
    and a Testing Notes section with integration test scenarios.
  agent: software_architect
  context: [write_requirements]

threat_model:
  description: >
    Review the system design and produce a security threat model and requirements
    addendum. Use the STRIDE methodology. Cover:
    1. Trust Boundaries
    2. Threat Enumeration (STRIDE per component)
    3. Risk Rating (High/Medium/Low per threat)
    4. Security Requirements (SR-001, SR-002, ...) the developer must implement
    5. Compliance Notes (e.g. OWASP Top 10 applicability)

    Flag any design decisions that introduce unacceptable risk.

    After the main document, append a `## Testing Notes` section containing:
    - For every SR-xxx: one concrete test case specifying the exact input or action
      to use, and the exact response or behaviour that proves the requirement is met
      (e.g. "SR-001: Send a request with an expired JWT — expect HTTP 401 with
      body {error: 'token_expired'}")
    - Negative test cases: inputs that MUST be rejected and the expected error
    - Any security behaviour that requires a specific test order or state setup

    Your final response must be the complete security threat model.
  expected_output: >
    A security addendum with STRIDE threat table, risk ratings, numbered SR-xxx
    requirements, and a Testing Notes section with one concrete test per SR.
  agent: security_architect
  context: [design_system]

design_database:
  description: >
    Using the requirements and architecture documents, design the full persistence
    layer for this project. Produce a document with:

    1. Database Engine Choice — which database (Postgres, SQLite, MySQL, MongoDB,
       DynamoDB, etc.) and version, with a one-paragraph justification grounded
       in the access patterns the architecture implies. Use `lookup_latest_version`
       with ecosystem='runtime' to confirm the version you choose is currently
       supported (not past EOL).

    2. Entity-Relationship Model — Mermaid ER diagram covering every entity from
       the architecture's data models. Show cardinality on every relationship.

    3. Schema (DDL) — complete `CREATE TABLE` statements (or equivalent for
       NoSQL). Include column types, NOT NULL, defaults, foreign keys, ON DELETE
       behaviour, and CHECK constraints. No hand-waving.

    4. Indexes — every index with the columns covered, the index type
       (btree/hash/GIN/GiST), and a one-line justification tied to a query
       pattern from the architecture. Flag any query the architecture implies
       that has no supporting index.

    5. Migrations — list the migration files the developer must produce, in
       order. Use the convention `migrations/0001_<description>.sql`,
       `migrations/0002_<description>.sql`, etc. Each migration must be
       idempotent and reversible (include the down-migration).

    6. Seed Data — a minimal seed script (`migrations/seed.sql` or
       `seeds/seed.sql`) that creates enough data to make the app demo-able.

    7. Operational Concerns — connection pooling defaults, expected row counts
       at year 1 / year 3, when sharding or read replicas would become necessary,
       and which fields require encryption at rest (cross-reference SR-xxx
       requirements from the security addendum).

    After the main design, append a `## Testing Notes` section containing:
    - Migration tests: every migration must be tested up + down on a fresh DB
    - Constraint tests: insert violations the schema must reject (FK, CHECK, UNIQUE)
    - Index coverage tests: every documented query pattern must use an index
      (verify with EXPLAIN, no sequential scans on hot paths)
    - Concurrency tests: any row that could be updated under contention needs a
      test that proves the locking strategy works

    Your final response must be the complete database design document.
  expected_output: >
    A database design document with engine choice, ER diagram, complete DDL,
    indexes with justifications, ordered migration list, seed data, operational
    notes, and a Testing Notes section.
  agent: database_engineer
  context: [write_requirements, design_system, threat_model]

plan_tasks:
  description: >
    Using the architecture doc, security addendum, and database design, produce
    an ordered development task list. Each task must have:
    - Task ID (T-001, T-002, ...)
    - Title (imperative, ≤10 words)
    - Description (what to build, not how)
    - Definition of Done (observable, testable)
    - Dependencies (other task IDs, or "none")
    - Estimated complexity (S/M/L)

    Tasks should be sequenced so no task is blocked until its dependency completes.
    Architecture and security requirements must each be covered by at least one task.

    After the main task list, append a `## Testing Notes` section containing:
    - For every T-xxx: the single most important observable condition that proves
      the Definition of Done is met and can be asserted in an automated test
    - Any task whose completion can only be verified manually, and why
    - Task ordering dependencies that affect test execution order

    Your final response must be the complete development task list.
  expected_output: >
    A task list with summary table, all tasks in specified format,
    and a Testing Notes section mapping each T-xxx to a testable assertion.
  agent: engineering_manager
  context: [design_system, threat_model, design_database]

design_ui:
  description: >
    Using the requirements document and system architecture, produce a complete UI
    design specification for the frontend. The spec must cover:

    1. Information Architecture — page list with route paths and purpose
    2. Component Hierarchy — Mermaid tree of every reusable component
    3. Page Wireframes — ASCII wireframe for each major page/view
    4. Design Tokens — color palette (primary, secondary, accent, destructive,
       background, foreground, muted, border) in HSL for both light and dark mode,
       font stack, border-radius scale, spacing scale
    5. shadcn/ui Component Mapping — for each UI element, specify which shadcn/ui
       primitive to use (Button, Card, Dialog, Table, Form, Input, etc.)
    6. State & Interaction Patterns — loading states, empty states, error states,
       optimistic updates where applicable
    7. API Integration Points — which backend endpoints each page/component calls,
       request/response shapes the frontend needs to handle

    Ground every decision in the functional requirements. Note which AC-FR-xxx
    each page or component satisfies.

    After the main spec, append a `## Testing Notes` section containing:
    - For each page: the interaction states to assert (loading, empty, error, success)
    - Form validation rules to verify (which fields, which error messages, inline vs toast)
    - Keyboard navigation paths through each major workflow
    - Responsive breakpoints where layout changes — what to assert at each breakpoint
    - Dark mode: which tokens change and which components to spot-check
    - Any animation or transition that affects test timing (e.g. requires a wait)

    Your final response must be the complete UI design specification.
  expected_output: >
    A UI design spec with all seven sections, wireframes, design tokens,
    and a Testing Notes section with interaction states and form validation rules.
  agent: ui_designer
  context: [write_requirements, design_system]

implement_code:
  description: >
    Implement every task in the task list as real, runnable Python source files.
    Use the `write_project_file` tool to write each file — one tool call per file.

    Before adding a third-party package to deps.txt, call `lookup_latest_version`
    with ecosystem='pypi' to confirm the package exists and to use APIs that match
    the current stable release. The project will run on Python 3.14 — use modern
    Python features (PEP 695 type aliases, structural pattern matching, etc.) where
    they make the code clearer.

    Required files you MUST produce:
    1. All Python source modules under src/{project_name}/
    2. A top-level deps.txt listing every third-party pip package the code needs,
       one package name per line (e.g. "fastapi", "httpx", "pydantic"). Do NOT
       include the Python standard library. Do NOT include version pins — package
       names only.
    3. A README.md at the project root with setup and usage instructions
       (focus on what the app does and how to use it — the harness will append a
       deployment section covering Docker and native install).
    4. A top-level conftest.py with EXACTLY this content (no other code in it):
           import sys
           from pathlib import Path
           sys.path.insert(0, str(Path(__file__).parent / "src"))
    5. A top-level start.sh with this exact shape (substitute the real startup command):
           #!/usr/bin/env bash
           set -euo pipefail
           exec <command> --host 0.0.0.0 --port "${PORT:-8000}"
       It MUST bind to 0.0.0.0 (not 127.0.0.1) and honour the PORT env var.

    Rules:
    - Complete files only — no ellipsis, no "# TODO", no placeholders.
    - Full type hints throughout.
    - Satisfy every SR-xxx security requirement from the security addendum.
    - Follow the architecture decisions exactly.
    - DO NOT create pyproject.toml, setup.py, Dockerfile, docker-compose.yml,
      Makefile, .env.example, or .dockerignore — the harness owns all infra files.
    - Logs go to stdout/stderr only (never to disk).
    - Use pathlib for all path operations. Never hardcode absolute paths.

    After writing all source files, append a `## Testing Notes` section to your
    manifest and include:
    - Non-obvious edge cases in your implementation that tests must cover
    - Any assumption your code makes about its inputs that could silently break
    - Retry/timeout/backoff behaviour and how to trigger it in tests
    - Error paths that require specific setup (e.g. database unavailable, third-party
      API failure) and how to simulate them
    - Any global state or singleton that affects test isolation

    {backend_standards}

    Your final response must be the complete implementation manifest.

    {backend_validation_instructions}
  expected_output: >
    All source files written via write_project_file. deps.txt and README.md present.
    Manifest artifact with Testing Notes section and final pytest result.
  agent: developer
  context: [plan_tasks, threat_model, design_database]

implement_ui:
  description: >
    Implement the UI design spec as a complete React + TypeScript + Tailwind CSS
    frontend. Use the `write_project_file` tool to write every file — one call per file.
    All files go under frontend/.

    Before pinning any npm package version in package.json, call `lookup_latest_version`
    with ecosystem='npm' to use the current stable release. The frontend will be
    built and served on Node 24 — assume modern ES2024+ features are available.

    Required structure:
    - frontend/package.json          (all npm deps, scripts: dev, build, preview, lint)
    - frontend/tsconfig.json
    - frontend/vite.config.ts        (use Vite + React plugin)
    - frontend/tailwind.config.ts    (extend with design tokens from the UI spec)
    - frontend/postcss.config.js
    - frontend/index.html
    - frontend/src/main.tsx
    - frontend/src/App.tsx           (router setup with react-router-dom)
    - frontend/src/lib/utils.ts      (cn() helper for Tailwind class merging)
    - frontend/src/components/ui/    (shadcn/ui primitive wrappers)
    - frontend/src/components/       (feature components)
    - frontend/src/pages/            (one file per page/route)
    - frontend/src/hooks/            (custom React hooks for API calls)
    - frontend/src/types/api.ts      (TypeScript types matching backend API contracts)

    Rules:
    - Complete files only — no placeholders, no "// TODO".
    - Strict TypeScript throughout — no `any`, no implicit types.
    - Implement dark mode via Tailwind's `dark:` variant + a ThemeProvider.
    - Every interactive element must have keyboard navigation and ARIA labels.
    - Use fetch or axios in hooks — do not call APIs directly from components.
    - Match the design tokens from the UI spec exactly.
    - Connect to the backend API base URL via an env var (VITE_API_BASE_URL).

    After writing all files, append a `## Testing Notes` section to your manifest:
    - Component prop edge cases (empty arrays, null optional props, max-length strings)
    - Async state transitions to assert (loading → success, loading → error)
    - Any component that behaves differently when the API is slow or unavailable
    - Accessibility assertions: which elements need role, aria-label, or aria-live
    - The two or three breakpoints where layout shifts most significantly

    {frontend_standards}

    Your final response must be the complete UI implementation manifest.

    {frontend_validation_instructions}
  expected_output: >
    Complete frontend/ directory written via write_project_file.
    Manifest artifact "7_ui_manifest.md" with Testing Notes section and final build result.
  agent: ui_developer
  context: [design_ui, implement_code]

review_code:
  description: >
    You are the last line of defence before QA and UAT. Read the actual source
    files and verify they match what was designed and specified.

    Step 1 — Orient yourself:
    Use `read_artifact` to read:
    - "6_implementation_manifest.md" — list of all backend files written
    - "7_ui_manifest.md"             — list of all frontend files written
    - "2_architecture.md"            — API contracts and data models
    - "3_security.md"                — SR-xxx security requirements
    - "4_tasks.md"                   — T-xxx definitions of done

    Step 2 — Read the code:
    {review_instructions}

    {reviewer_standards}

    Step 3 — Produce a structured review report with these sections:

    ### Architecture Compliance
    For each API endpoint in the architecture doc: does the implementation match
    the contract? Check method, path, request shape, response shape, and status
    codes. Cite the file and line range for any discrepancy.

    ### Security Compliance
    For each SR-xxx: is it implemented in the code? Quote the relevant code that
    satisfies it, or state exactly what is missing. Do not accept partial
    implementations as compliant.

    ### Task Completion
    For each T-xxx: is the Definition of Done met by the code? Cite evidence.

    ### Code Quality Findings
    Only real bugs, missing error handling, or logic errors that would cause
    incorrect behaviour at runtime. No style comments. Each finding must include:
    - File path and approximate line
    - What is wrong
    - What it should do instead

    ### Verdict
    - APPROVED — implementation matches design and all requirements are met
    - APPROVED WITH NOTES — minor issues found, safe to proceed, notes must be fixed
    - BLOCKED — critical issues found that will cause test or UAT failures

    Your final response must be the complete code review report.
  expected_output: >
    A code review report in markdown with all five sections.
    Every finding cites a specific file and requirement.
    A clear APPROVED / APPROVED WITH NOTES / BLOCKED verdict.
  agent: code_reviewer
  context: [implement_code, implement_ui, design_system, threat_model, plan_tasks, design_database]

write_tests:
  description: >
    Write a complete test suite for the implementation. Use the `write_project_file`
    tool to write each test file — one call per file.

    Before writing a single test, read the `## Testing Notes` sections from ALL
    prior artifacts — requirements, architecture, security, tasks, UI design,
    implementation manifest, and UI manifest. These sections contain domain-specific
    test cases contributed by every agent. Your job is to implement them all.

    Produce:
    1. tests/__init__.py (empty)
    2. At least one test module per source module (tests/test_<module>.py)
    3. tests/conftest.py with shared fixtures
    4. frontend/src/__tests__/ with at least one component test per page

    Coverage requirements:
    - Every AC-FR-xxx from the requirements
    - Every SR-xxx security requirement (use the concrete test cases from the
      security Testing Notes — do not invent your own)
    - Every T-xxx Definition of Done assertion from the EM Testing Notes
    - Every API contract scenario from the architecture Testing Notes
    - Every interaction state from the UI design Testing Notes
    - All implementation edge cases from the developer Testing Notes

    Use pytest fixtures and parametrize for multiple inputs.
    Use pytest-asyncio for async code.

    Before writing any test, read "8_code_review.md" via `read_artifact`. The Code
    Reviewer has already identified discrepancies — write tests that specifically
    target those findings in addition to the standard coverage requirements.

    After writing all test files, your final response must be the test plan document
    containing: what is covered, which code review findings are covered,
    and a gap analysis referencing any deferred items and why.
  expected_output: >
    All test files written to tests/ and frontend/src/__tests__/ via write_project_file.
    Test plan artifact "9_test_plan.md" with coverage mapping and gap analysis.
  agent: quality_engineer
  context: [write_requirements, design_system, threat_model, design_database, plan_tasks, design_ui, implement_code, implement_ui, review_code]

uat_report:
  description: >
    Act as the end user. Review ALL prior artifacts — requirements, architecture,
    security, tasks, UI design, implementation, UI implementation, and tests —
    then produce a UAT report.

    Structure:
    1. AC Coverage — for each AC-FR-xxx: PASS / FAIL / BLOCKED with evidence
    2. Security Coverage — for each SR-xxx: PASS / FAIL / BLOCKED with evidence
       (use the concrete test cases from the security Testing Notes as your benchmark)
    3. Architecture Compliance — does the implementation match the API contracts
       and data models from the architecture doc?
    4. UI Fidelity — does the frontend match the wireframes, design tokens, and
       interaction states from the UI design spec?
    5. Task Completion — for each T-xxx, is the Definition of Done met?
    6. Summary table (total PASS / FAIL / BLOCKED per category)
    7. Critical defects (must-fix before release)
    8. Minor defects (nice-to-fix)
    9. Final verdict: GO / NO-GO with a one-paragraph justification

    Be honest. Fail anything not fully satisfied. BLOCKED means the evidence
    needed to verify is missing from the artifacts.

    Also read "8_code_review.md" via `read_artifact` — the Code Reviewer has already
    assessed architecture and security compliance. Use their findings as evidence
    to support your PASS / FAIL ratings rather than re-deriving them from scratch.

    Your final response must be the complete UAT report.
  expected_output: >
    A UAT report covering ACs, SRs, architecture compliance, UI fidelity,
    and task completion. Pass/fail/blocked table per category. GO / NO-GO verdict.
  agent: uat_tester
  context: [write_requirements, design_system, threat_model, plan_tasks, design_ui, implement_code, implement_ui, review_code, write_tests]

# ── Revision cycle tasks (used only when UAT returns NO-GO) ──────────────────

fix_code:
  description: >
    The UAT report identified critical backend defects that must be fixed before
    the project can ship. Use `read_artifact` to read "9_uat_report.md" and
    identify every backend defect. Also read "2_architecture.md" and
    "3_security.md" to ensure your fixes stay within the agreed design and
    satisfy all security requirements.

    Fix ONLY what is broken — do not refactor working code.
    Use `write_project_file` to overwrite each affected file with the complete
    corrected version. One tool call per file.

    Your final response must be the fix summary listing:
    - Which defects were addressed
    - Which files were changed and why
    - Any defects that could not be fixed and why

    {backend_validation_instructions}
  expected_output: >
    Corrected source files written via write_project_file.
    Fix summary artifact saved via write_artifact. Final pytest result appended.
  agent: developer

fix_ui:
  description: >
    The UAT report identified critical frontend defects that must be fixed.
    Use `read_artifact` to read "9_uat_report.md" for the UI defects, and
    "5_ui_design.md" to verify your fixes match the original design spec.

    Fix ONLY what is broken — do not rewrite working components.
    Use `write_project_file` to overwrite each affected frontend file with the
    complete corrected version. One tool call per file.

    Your final response must be the fix summary listing:
    - Which UI defects were addressed
    - Which files were changed and why
    - Any defects that could not be fixed and why

    {frontend_validation_instructions}
  expected_output: >
    Corrected frontend files written via write_project_file.
    Fix summary artifact saved via write_artifact. Final build result appended.
  agent: ui_developer

re_test:
  description: >
    The backend and frontend have been revised. Re-run the full test suite
    against the corrected implementation.

    Use `read_artifact` to read the fix summaries to understand what changed.
    Update or add tests specifically targeting the defects that were fixed.
    Use `write_project_file` to write updated test files.

    Your final response must be the revised test plan noting which defects now have
    test coverage and whether any gaps remain.
  expected_output: >
    Updated test files written via write_project_file.
    Revised test plan artifact saved via write_artifact.
  agent: quality_engineer

re_uat:
  description: >
    The implementation has been revised and retested. Re-evaluate the project
    against all original acceptance criteria.

    Use `read_artifact` to read:
    - "1_requirements.md" — the original acceptance criteria
    - "3_security.md" — the original security requirements
    - "9_uat_report.md" — the prior UAT report with the defect list
    - "revision_{revision_num}_backend_fixes.md" — what the developer fixed
    - "revision_{revision_num}_ui_fixes.md" — what the UI developer fixed

    Focus your evaluation on the previously-failed items. For each prior defect:
    PASS if fixed, FAIL if still broken, BLOCKED if evidence is insufficient.

    Produce a revised UAT report with:
    1. Prior defects — PASS / FAIL / BLOCKED with evidence
    2. Regression check — confirm previously-passing items still pass
    3. Updated summary table
    4. Final verdict: GO / NO-GO with justification

    Your final response must be the revised UAT report.
  expected_output: >
    Revised UAT report with focused pass/fail on prior defects, regression check,
    and a final GO / NO-GO verdict.
  agent: uat_tester
